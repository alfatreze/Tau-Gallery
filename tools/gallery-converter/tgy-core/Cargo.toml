[package]
name = "tgy-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "tgy_core"
path = "src/lib.rs"

[[bin]]
name = "tgyconv"
path = "src/bin/tgyconv.rs"

[dependencies]
rayon = "1"
crc32fast = "1"
serde_json = "1"
kamadak-exif = "0.6"
moxcms = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "webp", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
