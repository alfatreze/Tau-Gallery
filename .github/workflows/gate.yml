# The suite gates itself (CLAUDE.md section 4). CI runs `make gate-ci` (the gallery's tests and the decoder blocks); `make gate` adds the music player's inherited host tests, which do not pass on a clean clone.
# NOT run yet on a runner. The RISC-V compiler is the xPack build the project pins (tools/toolchain.py looks in toolchain/ first); Intel's altera_mf.v is never
# available here, so the whole-core simulation (sim/fullcore) is not part of this gate.
name: gate
on: [push, pull_request]
jobs:
  host-and-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator python3-numpy python3-pil build-essential
          mkdir -p toolchain
          curl -sL https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz | tar xz -C toolchain
      - name: gate
        run: make gate-ci
